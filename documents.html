<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <link rel="icon" href="Plugin icon - 1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документы - BMP Metro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        bgLight: '#f4f4f5', bgDark: '#09090b',
                        cardLight: '#ffffff', cardDark: '#18181b',
                        borderLight: '#e4e4e7', borderDark: '#27272a',
                        accent: '#e32636'
                    }
                }
            }
        }
        if (localStorage.getItem('color-theme') === 'light' || (!('color-theme' in localStorage) && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .bento-card {
            @apply bg-cardLight dark:bg-cardDark border border-borderLight dark:border-borderDark rounded-2xl p-6 sm:p-8 transition-all duration-300 relative overflow-hidden shadow-sm hover:shadow-md;
        }
        .bento-hover {
            @apply hover:-translate-y-1 hover:border-accent/50 dark:hover:border-accent/50;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
            auto-rows: minmax(100px, auto);
        }
        .page-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e32636; border-radius: 10px; }
    </style>
</head>
<body class="text-gray-900 bg-bgLight dark:bg-bgDark dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-300">
    <div class="w-full flex justify-center sticky top-6 z-50 px-4 pointer-events-none">
        <header class="w-full max-w-6xl bg-white/80 dark:bg-[#18181b]/80 backdrop-blur-xl border border-gray-200 dark:border-gray-800 rounded-full px-6 py-3 flex justify-between items-center shadow-lg pointer-events-auto transition-colors">
            <a href="/" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full bg-accent flex items-center justify-center text-white font-black overflow-hidden relative">
                    <img src="Plugin icon - 1.png" alt="Logo" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'">
                    <span class="relative z-10">M</span>
                </div>
                <span class="font-black text-xl tracking-tight hidden sm:block">BMP</span>
            </a>
            
            <nav class="hidden lg:flex items-center gap-1 relative" id="main-nav">
<div id="nav-bg" class="absolute left-0 h-9 bg-gray-200 dark:bg-gray-800 rounded-full transition-all duration-300 ease-in-out z-0 opacity-0 pointer-events-none"></div>
<a href="/" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Дом</a>
<a href="development" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Разработка</a>
<a href="map" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Маршруты</a>
<a href="vacancies" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Вакансии</a>
<a href="documents" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-accent active-nav">Документы</a>
<a href="links" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Ссылки</a>
<a href="team" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Команда</a>
<a href="photos" class="nav-item relative z-10 px-4 py-2 rounded-full text-sm font-bold transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Фото</a>
</nav>

            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                </button>
                <button id="mobile-btn" class="w-10 h-10 rounded-full flex lg:hidden items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </header>
    </div>

    <!-- Mobile Menu Modal -->
    <div id="mobile-menu" class="fixed inset-0 bg-bgLight/95 dark:bg-bgDark/95 backdrop-blur-xl z-[40] hidden flex-col items-center justify-center gap-6 text-xl font-black">
        <a href="/" class="hover:text-accent transition-colors">Дом</a>
        <a href="development" class="hover:text-accent transition-colors">Разработка</a>
        <a href="map" class="hover:text-accent transition-colors">Маршруты</a>
        <a href="vacancies" class="hover:text-accent transition-colors">Вакансии</a>
        <a href="documents" class="hover:text-accent transition-colors">Документы</a>
        <a href="links" class="hover:text-accent transition-colors">Ссылки</a>
        <a href="team" class="hover:text-accent transition-colors">Команда</a>
        <a href="photos" class="hover:text-accent transition-colors">Фотографии</a>
    </div>

    <main class="flex-grow w-full max-w-6xl mx-auto px-4 pt-12 pb-24 page-fade flex flex-col">

        <div class="mb-8 pl-2">
            <span class="uppercase tracking-widest text-xs font-bold text-accent mb-2 block">Archive</span>
            <h1 class="text-4xl md:text-5xl font-black tracking-tight">Документы</h1>
        </div>
        
        <div class="bento-grid">
            <div class="bento-card col-span-12 flex flex-col !p-0 h-[75vh]">
                <div class="p-5 border-b border-borderLight dark:border-borderDark flex items-center justify-between bg-gray-50 dark:bg-[#1f1f22]">
                    <h3 class="font-black uppercase tracking-wide text-sm flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Официальная документация BMP
                    </h3>
                </div>
                <iframe src="https://docs.google.com/document/d/1adSLMPkEXRb3CMn66O02oOzUs624XIM7smZmpUz3RQQ/preview" class="w-full flex-grow border-0 grayscale-[0.1]"></iframe>
            </div>
        </div>
    </main>

    <footer class="w-full border-t border-borderLight dark:border-borderDark py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-sm font-medium text-gray-500">
            <div>BMP Metro 2026. Проект в Roblox.</div>
            <a href="mailto:workerowerk@gmail.com" class="hover:text-accent transition-colors">workerowerk@gmail.com</a>
        </div>
    </footer>

    <script>
        // Nav Sliding Oval Logic
        const nav = document.getElementById('main-nav');
        if(nav) {{
            const navBg = document.getElementById('nav-bg');
            const items = nav.querySelectorAll('.nav-item');
            const activeItem = nav.querySelector('.active-nav');

            function moveBg(item) {{
                if(!item) return;
                navBg.style.width = item.offsetWidth + 'px';
                navBg.style.transform = `translateX(${{item.offsetLeft}}px)`;
                navBg.style.opacity = '1';
            }}
            
            if(activeItem) {{
                setTimeout(() => moveBg(activeItem), 50);
                window.addEventListener('resize', () => moveBg(activeItem));
            }}

            items.forEach(item => {{
                item.addEventListener('mouseenter', () => moveBg(item));
                item.addEventListener('mouseleave', () => moveBg(activeItem));
            }});
        }}

        // Theme logic
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        
        if (document.documentElement.classList.contains('dark')) {{
            lightIcon.classList.remove('hidden');
        }} else {{
            darkIcon.classList.remove('hidden');
        }}

        document.getElementById('theme-toggle').addEventListener('click', function() {{
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {{
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }} else {{
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }}
        }});

        // Mobile menu toggle
        const btn = document.getElementById('mobile-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => {{
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
            document.body.classList.toggle('overflow-hidden');
        }});
    </script>
</body>
</html>
